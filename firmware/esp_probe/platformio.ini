[platformio]
default_envs = esp32-cyd-024

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TFT_eSPI@^2.5.43

[env:esp32-cyd-024]
platform = espressif32@7.1.3
board = esp32dev
board_upload.flash_size = 4MB
build_flags =
    -DESP_PROBE_CYD
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_BACKLIGHT_OFF=LOW
    -DLOAD_GLCD
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000

[env:esp32dev]
extends = env:esp32-cyd-024

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
